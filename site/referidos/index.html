<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Referidos | OKUNAMI</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../css/pages.css">
<style>
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
  .stat b{font-family:var(--display);font-size:28px;line-height:1.05;color:var(--ink)}
  .stat span{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
  .stat.hot{background:var(--tint);border-color:var(--blush)}
  .stat.hot b{color:var(--rose)}
  .refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  .r{border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
  .r .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .r .who b{display:block;font-size:17px}
  .r .who span{font-size:13px;color:var(--mute)}
  .r .code{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--rose);white-space:nowrap}
  .st{align-self:flex-start;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--tint);color:var(--rose)}
  .st.sold{background:#E7F7EE;color:#1E7A46}
  .st.lost{background:#F1F2F5;color:var(--mute)}
  .r .money{font-size:14px}
  .edit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .edit select,.edit input{min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:#FFF;font-size:15px;min-width:0}
  .edit .full{grid-column:1/-1}
  .rbtns{display:flex;gap:8px;flex-wrap:wrap}
  .mini{min-height:42px;padding:0 16px;border-radius:999px;border:0;background:var(--tint);color:var(--rose);font-weight:700;font-size:13px;display:inline-flex;align-items:center;cursor:pointer}
  .mini.save{background:var(--coral);color:#FFF}
  .empty{color:var(--mute);text-align:center;padding:20px 0}
  .who-role{font-size:13px;color:var(--mute);margin:0}
</style>
</head>
<body>
<main class="pg">
  <div class="pg-top">
    <span class="pg-back">OKUNAMI</span>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="es" aria-pressed="true">ES</button></div>
  </div>

  <header class="hero">
    <p class="eyebrow" data-t="eyebrow">Tarjeta de Mayra Soto Burgos</p>
    <h1 data-t="h1">Referidos</h1>
    <p class="who-role" id="whoRole" hidden></p>
  </header>

  <form class="form" id="login" novalidate>
    <label class="field"><span>PIN</span><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="64" required></label>
    <p class="err" id="pinErr" role="alert" hidden></p>
    <button type="submit" class="pill coral" id="pinBtn"><span data-t="enter">Entrar</span></button>
  </form>

  <section id="app" class="form" hidden>
    <div class="stats">
      <div class="stat"><b id="tRefs">0</b><span data-t="tRefs">Referidos</span></div>
      <div class="stat"><b id="tSold">0</b><span data-t="tSold">Vendidos</span></div>
      <div class="stat"><b id="tSales">$0</b><span data-t="tSales">Ventas</span></div>
      <div class="stat hot"><b id="tCom">$0</b><span data-t="tCom">Comisión de Hiram (40%)</span></div>
    </div>
    <ul class="refs" id="list"></ul>
    <button type="button" class="link" id="out" data-t="out" style="border:0;background:none;cursor:pointer">Salir</button>
  </section>

  <p class="credit"><b>OKUNAMI</b> · <span data-t="crafted">Hecho por</span> <a href="https://finessemedia.pro" target="_blank" rel="noopener">Finesse Media</a></p>
</main>
<script src="../js/pages.js"></script>
<script>
(function () {
  var D = {
    es: { title: 'Referidos | OKUNAMI', eyebrow: 'Tarjeta de Mayra Soto Burgos', h1: 'Referidos', enter: 'Entrar', out: 'Salir', crafted: 'Hecho por',
      tRefs: 'Referidos', tSold: 'Vendidos', tSales: 'Ventas', tCom: 'Comisión de Hiram (40%)',
      admin: 'Entraste como Angel. Puedes marcar ventas.', partner: 'Entraste como Hiram. Ves tus referidos y tu comisión.',
      wrong: 'PIN incorrecto.', locked: 'Demasiados intentos. Espera 15 minutos.', fail: 'No se pudo conectar. Intenta otra vez.',
      empty: 'Todavía no hay referidos. Llegan aquí cuando alguien pide su vCard desde la tarjeta de Mayra.',
      st: { new: 'Nuevo', contacted: 'Contactado', sold: 'Vendido', lost: 'No compró' },
      sale: 'Venta', com: 'Comisión', amount: 'Monto de la venta ($)', note: 'Nota (opcional)', save: 'Guardar', wa: 'WhatsApp',
      saved: 'Guardado', needAmount: 'Pon el monto de la venta.', biz: 'Negocio' },
    en: { title: 'Referrals | OKUNAMI', eyebrow: "Mayra Soto Burgos's card", h1: 'Referrals', enter: 'Sign in', out: 'Sign out', crafted: 'Crafted by',
      tRefs: 'Referrals', tSold: 'Sold', tSales: 'Sales', tCom: "Hiram's commission (40%)",
      admin: 'Signed in as Angel. You can mark sales.', partner: 'Signed in as Hiram. You see your referrals and commission.',
      wrong: 'Wrong PIN.', locked: 'Too many tries. Wait 15 minutes.', fail: 'Could not connect. Try again.',
      empty: "No referrals yet. They show up here when someone asks for their vCard from Mayra's card.",
      st: { new: 'New', contacted: 'Contacted', sold: 'Sold', lost: 'Did not buy' },
      sale: 'Sale', com: 'Commission', amount: 'Sale amount ($)', note: 'Note (optional)', save: 'Save', wa: 'WhatsApp',
      saved: 'Saved', needAmount: 'Enter the sale amount.', biz: 'Business' }
  };
  MS.translate(D);
  var KEY = 'okunami-ref-token', token = '', role = '', DATA = null;
  try { token = localStorage.getItem(KEY) || ''; } catch (e) {}
  function $(id) { return document.getElementById(id); }
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function money(n) { return '$' + (Number(n) || 0).toFixed(2).replace(/\.00$/, ''); }
  function api(method, body, q) {
    var o = { method: method, headers: { Authorization: 'Bearer ' + token } };
    if (body) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
    return fetch('/api/referral' + (q || ''), o).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw { code: r.status, error: d.error }; return d; }); });
  }
  function fmtDate(iso, l) { var d = new Date(iso); return d.toLocaleDateString(l === 'en' ? 'en-US' : 'es-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function render(l) {
    if (!DATA) return;
    var L = D[l], t = DATA.totals;
    $('whoRole').textContent = L[role]; $('whoRole').hidden = false;
    $('tRefs').textContent = t.referrals; $('tSold').textContent = t.sold; $('tSales').textContent = money(t.sales); $('tCom').textContent = money(t.commission);
    var ul = $('list'); ul.innerHTML = '';
    if (!DATA.referrals.length) { ul.appendChild(el('li', 'empty', L.empty)); return; }
    DATA.referrals.forEach(function (r) {
      var li = el('li', 'r');
      var top = el('div', 'top'), who = el('div', 'who');
      who.appendChild(el('b', null, r.name));
      who.appendChild(el('span', null, [r.business, r.phone ? (role === 'admin' ? '+' + r.phone : r.phone) : '', fmtDate(r.created, l)].filter(Boolean).join(' · ')));
      top.appendChild(who); top.appendChild(el('span', 'code', r.code)); li.appendChild(top);
      li.appendChild(el('span', 'st ' + r.status, L.st[r.status] || r.status));
      if (r.status === 'sold') li.appendChild(el('p', 'money', L.sale + ': ' + money(r.amount) + ' · ' + L.com + ': ' + money(r.amount * t.rate)));
      if (r.note) li.appendChild(el('p', 'money', r.note));
      if (role === 'admin') {
        var ed = el('div', 'edit');
        var sel = el('select'); ['new', 'contacted', 'sold', 'lost'].forEach(function (k) { var o = el('option', null, L.st[k]); o.value = k; if (k === r.status) o.selected = true; sel.appendChild(o); });
        sel.setAttribute('aria-label', 'Status');
        var amt = el('input'); amt.type = 'number'; amt.inputMode = 'decimal'; amt.min = '0'; amt.step = '0.01'; amt.placeholder = L.amount; amt.setAttribute('aria-label', L.amount); if (r.amount) amt.value = r.amount;
        var note = el('input', 'full'); note.placeholder = L.note; note.setAttribute('aria-label', L.note); note.value = r.note || '';
        ed.appendChild(sel); ed.appendChild(amt); ed.appendChild(note); li.appendChild(ed);
        var bt = el('div', 'rbtns');
        var save = el('button', 'mini save', L.save); save.type = 'button';
        save.addEventListener('click', function () {
          if (sel.value === 'sold' && !(Number(amt.value) > 0)) { save.textContent = L.needAmount; return; }
          save.disabled = true;
          api('PATCH', { id: r.id, status: sel.value, amount: amt.value === '' ? 0 : Number(amt.value), note: note.value })
            .then(function (d) { var i = DATA.referrals.findIndex(function (x) { return x.id === r.id; }); DATA.referrals[i] = d.referral; DATA.totals = d.totals; render(MS.lang()); })
            .catch(function (e) { save.disabled = false; save.textContent = e && e.error === 'need_amount' ? L.needAmount : L.fail; });
        });
        var wa = el('a', 'mini', L.wa); wa.href = 'https://wa.me/' + r.phone; wa.target = '_blank'; wa.rel = 'noopener';
        bt.appendChild(save); bt.appendChild(wa); li.appendChild(bt);
      }
      ul.appendChild(li);
    });
  }
  function load() {
    return api('GET').then(function (d) { DATA = d; role = d.role; $('login').hidden = true; $('app').hidden = false; render(MS.lang()); })
      .catch(function (e) { if (e && e.code === 401) { token = ''; try { localStorage.removeItem(KEY); } catch (x) {} $('login').hidden = false; $('app').hidden = true; } });
  }
  MS.onLang(render);
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var L = D[MS.lang()], err = $('pinErr');
    fetch('/api/referral?login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: $('pin').value }) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw d; return d; }); })
      .then(function (d) { token = d.token; try { localStorage.setItem(KEY, token); } catch (x) {} $('pin').value = ''; err.hidden = true; return load(); })
      .catch(function (d) { err.textContent = d && d.error === 'locked' ? L.locked : d && d.error === 'wrong_pin' ? L.wrong : L.fail; err.hidden = false; });
  });
  $('out').addEventListener('click', function () { token = ''; DATA = null; try { localStorage.removeItem(KEY); } catch (x) {} $('app').hidden = true; $('login').hidden = false; $('whoRole').hidden = true; });
  if (token) load();
})();
</script>
</body>
</html>
